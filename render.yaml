# Render Blueprint: the DevProof backend (FastAPI) and its PostgreSQL
# database. In Render: New > Blueprint > pick this repository.
# Values marked `sync: false` are asked for when the Blueprint is created
# (see README.md "Deploy").
services:
  - type: web
    name: devproof-api
    runtime: python
    plan: free
    rootDir: code/backend
    buildCommand: >-
      pip install -r requirements.txt &&
      pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: devproof-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: RECRUITER_AUTO_APPROVE_DOMAINS
        sync: false

databases:
  - name: devproof-db
    plan: free
    databaseName: devproof
    user: devproof
