name: Backend CI

on:
  pull_request:
    branches: [main]
    paths:
      - "code/backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "code/backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    name: Lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devproof
          POSTGRES_PASSWORD: devproof
          POSTGRES_DB: devproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://devproof:devproof@localhost:5432/devproof
      JWT_SECRET: ci-test-secret
      GOOGLE_CLIENT_ID: ci-test-client-id

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: code/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests with pytest
        run: pytest -v
